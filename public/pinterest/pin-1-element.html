<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pin 1 — Bazi Element</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1000px;
    height: 1500px;
    background: #12121a;
    font-family: 'Georgia', 'Times New Roman', serif;
    color: #c9a84c;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* 装饰边框 */
  .border-frame {
    position: absolute;
    inset: 40px;
    border: 1px solid rgba(201, 168, 76, 0.15);
    pointer-events: none;
  }
  .border-frame::before {
    content: '';
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(201, 168, 76, 0.08);
  }

  /* 四角装饰 */
  .corner {
    position: absolute;
    width: 30px;
    height: 30px;
    border-color: #c9a84c;
    border-style: solid;
    opacity: 0.5;
  }
  .corner-tl { top: 30px; left: 30px; border-width: 2px 0 0 2px; }
  .corner-tr { top: 30px; right: 30px; border-width: 2px 2px 0 0; }
  .corner-bl { bottom: 30px; left: 30px; border-width: 0 0 2px 2px; }
  .corner-br { bottom: 30px; right: 30px; border-width: 0 2px 2px 0; }

  /* 顶部装饰线 */
  .top-line {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #c9a84c, transparent);
    margin-bottom: 40px;
  }

  /* 八卦符号行 */
  .bagua-row {
    display: flex;
    gap: 40px;
    margin-bottom: 50px;
    font-size: 52px;
    opacity: 0.6;
    letter-spacing: 12px;
  }

  /* 主标题 */
  .main-title {
    font-size: 72px;
    font-weight: 400;
    letter-spacing: 3px;
    text-align: center;
    line-height: 1.2;
    margin-bottom: 24px;
    background: linear-gradient(180deg, #e8d5a0 0%, #c9a84c 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* 副标题 */
  .subtitle {
    font-size: 32px;
    font-weight: 400;
    letter-spacing: 6px;
    text-transform: uppercase;
    opacity: 0.7;
    text-align: center;
    margin-bottom: 60px;
  }

  /* 五行符号 */
  .wuxing-row {
    display: flex;
    gap: 50px;
    margin-bottom: 60px;
  }
  .wuxing-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .wuxing-symbol {
    width: 90px;
    height: 90px;
    border: 1px solid rgba(201, 168, 76, 0.3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    background: rgba(201, 168, 76, 0.03);
  }
  .wuxing-label {
    font-size: 22px;
    letter-spacing: 4px;
    opacity: 0.7;
    text-transform: uppercase;
  }

  /* 中间分隔线 */
  .divider {
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,0.4), transparent);
    margin-bottom: 50px;
  }

  /* 引导文字 */
  .cta-text {
    font-size: 28px;
    letter-spacing: 2px;
    opacity: 0.6;
    text-align: center;
    line-height: 1.8;
    margin-bottom: 80px;
  }

  /* 底部网址 */
  .footer {
    position: absolute;
    bottom: 60px;
    font-size: 26px;
    letter-spacing: 8px;
    opacity: 0.5;
  }

  /* 微妙光晕 */
  .glow {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,168,76,0.04) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="border-frame"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="top-line"></div>

  <div class="bagua-row">☰ ☱ ☲ ☳ ☴</div>

  <div class="main-title">What's Your<br>Bazi Element?</div>

  <div class="subtitle">Discover Your Five Elements Profile</div>

  <div class="wuxing-row">
    <div class="wuxing-item">
      <div class="wuxing-symbol">🔥</div>
      <div class="wuxing-label">Fire</div>
    </div>
    <div class="wuxing-item">
      <div class="wuxing-symbol">🌊</div>
      <div class="wuxing-label">Water</div>
    </div>
    <div class="wuxing-item">
      <div class="wuxing-symbol">🌳</div>
      <div class="wuxing-label">Wood</div>
    </div>
    <div class="wuxing-item">
      <div class="wuxing-symbol">⛰️</div>
      <div class="wuxing-label">Earth</div>
    </div>
    <div class="wuxing-item">
      <div class="wuxing-symbol">⚙️</div>
      <div class="wuxing-label">Metal</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="cta-text">
    Find out which element dominates<br>your destiny chart
  </div>

  <div class="footer">bornchart.app</div>
</body>
</html>
