<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pin 3 — Bazi Compatibility</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1000px;
    height: 1500px;
    background: #12121a;
    font-family: 'Georgia', 'Times New Roman', serif;
    color: #c9a84c;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .border-frame {
    position: absolute;
    inset: 40px;
    border: 1px solid rgba(201, 168, 76, 0.15);
    pointer-events: none;
  }
  .border-frame::before {
    content: '';
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(201, 168, 76, 0.08);
  }

  .corner {
    position: absolute;
    width: 30px;
    height: 30px;
    border-color: #c9a84c;
    border-style: solid;
    opacity: 0.5;
  }
  .corner-tl { top: 30px; left: 30px; border-width: 2px 0 0 2px; }
  .corner-tr { top: 30px; right: 30px; border-width: 2px 2px 0 0; }
  .corner-bl { bottom: 30px; left: 30px; border-width: 0 0 2px 2px; }
  .corner-br { bottom: 30px; right: 30px; border-width: 0 2px 2px 0; }

  .top-line {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #c9a84c, transparent);
    margin-bottom: 30px;
  }

  /* 阴阳符号 */
  .yin-yang-row {
    display: flex;
    align-items: center;
    gap: 30px;
    margin-bottom: 40px;
  }
  .person-icon {
    width: 120px;
    height: 120px;
    border: 1px solid rgba(201, 168, 76, 0.25);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    background: rgba(201, 168, 76, 0.03);
  }
  .heart-symbol {
    font-size: 64px;
    opacity: 0.8;
    animation: none;
  }

  /* 主标题 */
  .main-title {
    font-size: 64px;
    font-weight: 400;
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.3;
    margin-bottom: 16px;
    background: linear-gradient(180deg, #e8d5a0 0%, #c9a84c 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 36px;
    font-weight: 400;
    letter-spacing: 4px;
    text-align: center;
    margin-bottom: 60px;
    background: linear-gradient(180deg, #e8d5a0 0%, #c9a84c 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* 分隔 */
  .divider {
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,0.4), transparent);
    margin-bottom: 50px;
  }

  /* 合婚要点 */
  .compat-items {
    display: flex;
    flex-direction: column;
    gap: 24px;
    margin-bottom: 50px;
    width: 620px;
  }
  .compat-item {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 18px 28px;
    border: 1px solid rgba(201, 168, 76, 0.12);
    background: rgba(201, 168, 76, 0.02);
  }
  .compat-icon {
    font-size: 34px;
    flex-shrink: 0;
  }
  .compat-text {
    font-size: 26px;
    letter-spacing: 1px;
    line-height: 1.5;
    opacity: 0.8;
  }
  .compat-text strong {
    color: #e8d5a0;
    font-weight: 400;
  }

  .cta-text {
    font-size: 26px;
    letter-spacing: 2px;
    opacity: 0.6;
    text-align: center;
    line-height: 1.8;
    margin-bottom: 80px;
  }

  .footer {
    position: absolute;
    bottom: 60px;
    font-size: 26px;
    letter-spacing: 8px;
    opacity: 0.5;
  }

  .glow {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,168,76,0.04) 0%, transparent 70%);
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  /* 免费标签 */
  .free-badge {
    display: inline-block;
    padding: 10px 36px;
    border: 1px solid #c9a84c;
    font-size: 22px;
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-bottom: 50px;
    opacity: 0.8;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="border-frame"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="top-line"></div>

  <div class="yin-yang-row">
    <div class="person-icon">👤</div>
    <div class="heart-symbol">💕</div>
    <div class="person-icon">👤</div>
  </div>

  <div class="free-badge">Free</div>

  <div class="main-title">Bazi Compatibility<br>Check</div>

  <div class="subtitle">Are You Meant to Be?</div>

  <div class="divider"></div>

  <div class="compat-items">
    <div class="compat-item">
      <div class="compat-icon">🔮</div>
      <div class="compat-text"><strong>Destiny Match:</strong> How your charts align</div>
    </div>
    <div class="compat-item">
      <div class="compat-icon">💞</div>
      <div class="compat-text"><strong>Love Potential:</strong> Strengths & challenges</div>
    </div>
    <div class="compat-item">
      <div class="compat-icon">⚖️</div>
      <div class="compat-text"><strong>Element Balance:</strong> Complementary forces</div>
    </div>
  </div>

  <div class="cta-text">
    Enter your birth dates to discover<br>your compatibility reading
  </div>

  <div class="footer">bornchart.app</div>
</body>
</html>
