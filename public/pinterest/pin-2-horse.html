<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pin 2 — 2026 Year of the Horse</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1000px;
    height: 1500px;
    background: #12121a;
    font-family: 'Georgia', 'Times New Roman', serif;
    color: #c9a84c;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .border-frame {
    position: absolute;
    inset: 40px;
    border: 1px solid rgba(201, 168, 76, 0.15);
    pointer-events: none;
  }
  .border-frame::before {
    content: '';
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(201, 168, 76, 0.08);
  }

  .corner {
    position: absolute;
    width: 30px;
    height: 30px;
    border-color: #c9a84c;
    border-style: solid;
    opacity: 0.5;
  }
  .corner-tl { top: 30px; left: 30px; border-width: 2px 0 0 2px; }
  .corner-tr { top: 30px; right: 30px; border-width: 2px 2px 0 0; }
  .corner-bl { bottom: 30px; left: 30px; border-width: 0 0 2px 2px; }
  .corner-br { bottom: 30px; right: 30px; border-width: 0 2px 2px 0; }

  .top-line {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #c9a84c, transparent);
    margin-bottom: 30px;
  }

  /* 年份大字 */
  .year-num {
    font-size: 160px;
    font-weight: 400;
    letter-spacing: 8px;
    background: linear-gradient(180deg, #e8d5a0 0%, #c9a84c 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
    line-height: 1;
  }

  .year-label {
    font-size: 36px;
    letter-spacing: 16px;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 20px;
  }

  /* 马符号 */
  .horse-symbol {
    font-size: 100px;
    margin-bottom: 30px;
    opacity: 0.85;
  }

  /* 主标题 */
  .main-title {
    font-size: 64px;
    font-weight: 400;
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.3;
    margin-bottom: 20px;
    background: linear-gradient(180deg, #e8d5a0 0%, #c9a84c 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 30px;
    font-weight: 400;
    letter-spacing: 5px;
    text-transform: uppercase;
    opacity: 0.7;
    text-align: center;
    margin-bottom: 60px;
  }

  /* 运势要点 */
  .fortune-items {
    display: flex;
    flex-direction: column;
    gap: 28px;
    margin-bottom: 60px;
    width: 600px;
  }
  .fortune-item {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 20px 28px;
    border: 1px solid rgba(201, 168, 76, 0.15);
    background: rgba(201, 168, 76, 0.02);
  }
  .fortune-icon {
    font-size: 36px;
    flex-shrink: 0;
  }
  .fortune-text {
    font-size: 26px;
    letter-spacing: 1px;
    line-height: 1.5;
    opacity: 0.8;
  }
  .fortune-text strong {
    color: #e8d5a0;
    font-weight: 400;
  }

  .divider {
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,0.4), transparent);
    margin-bottom: 50px;
  }

  .cta-text {
    font-size: 26px;
    letter-spacing: 2px;
    opacity: 0.6;
    text-align: center;
    line-height: 1.8;
    margin-bottom: 80px;
  }

  .footer {
    position: absolute;
    bottom: 60px;
    font-size: 26px;
    letter-spacing: 8px;
    opacity: 0.5;
  }

  .glow {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,168,76,0.04) 0%, transparent 70%);
    top: 35%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="border-frame"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="top-line"></div>

  <div class="year-num">2026</div>
  <div class="year-label">Year of the Horse</div>

  <div class="horse-symbol">🐎</div>

  <div class="main-title">Bazi Fortune<br>& Destiny Guide</div>

  <div class="subtitle">What the Stars Predict for You</div>

  <div class="fortune-items">
    <div class="fortune-item">
      <div class="fortune-icon">💰</div>
      <div class="fortune-text"><strong>Wealth:</strong> New opportunities for those who act</div>
    </div>
    <div class="fortune-item">
      <div class="fortune-icon">❤️</div>
      <div class="fortune-text"><strong>Love:</strong> Passion & transformation in relationships</div>
    </div>
    <div class="fortune-item">
      <div class="fortune-icon">🧭</div>
      <div class="fortune-text"><strong>Career:</strong> A year of bold moves & new paths</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="cta-text">
    Discover your personal 2026 fortune<br>based on your Bazi chart
  </div>

  <div class="footer">bornchart.app</div>
</body>
</html>
